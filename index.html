<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema de Inventario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Barra de navegación -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">📦 Inventario</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="#">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Productos</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Categorías</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Reportes</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-4">

    <!-- Tarjetas de resumen -->
    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h6 class="text-muted">Total de productos</h6>
            <h3 class="fw-bold" id="total-productos">0</h3>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h6 class="text-muted">Unidades en stock</h6>
            <h3 class="fw-bold" id="total-unidades">0</h3>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h6 class="text-muted">Stock bajo (&lt; 5)</h6>
            <h3 class="fw-bold text-danger" id="stock-bajo">0</h3>
          </div>
        </div>
      </div>
    </div>

    <!-- Formulario para agregar productos -->
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-white fw-semibold">Agregar producto</div>
      <div class="card-body">
        <form id="form-producto" class="row g-3">
          <div class="col-md-4">
            <input type="text" class="form-control" id="nombre" placeholder="Nombre" required>
          </div>
          <div class="col-md-3">
            <input type="text" class="form-control" id="categoria" placeholder="Categoría" required>
          </div>
          <div class="col-md-2">
            <input type="number" class="form-control" id="cantidad" placeholder="Cantidad" min="0" required>
          </div>
          <div class="col-md-2">
            <input type="number" class="form-control" id="precio" placeholder="Precio" min="0" step="0.01" required>
          </div>
          <div class="col-md-1 d-grid">
            <button type="submit" class="btn btn-success">+</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Tabla de productos -->
    <div class="card shadow-sm">
      <div class="card-header bg-white fw-semibold">Productos</div>
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>Nombre</th>
              <th>Categoría</th>
              <th class="text-end">Cantidad</th>
              <th class="text-end">Precio</th>
              <th class="text-end">Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-productos"></tbody>
        </table>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Productos de ejemplo (se pierden al recargar la página)
    const productos = [
      { nombre: 'Teclado', categoria: 'Periféricos', cantidad: 12, precio: 25.50 },
      { nombre: 'Mouse', categoria: 'Periféricos', cantidad: 3, precio: 15.00 },
      { nombre: 'Monitor 24"', categoria: 'Pantallas', cantidad: 7, precio: 180.00 }
    ];

    function render() {
      const tbody = document.getElementById('tabla-productos');
      tbody.innerHTML = '';
      productos.forEach((p, i) => {
        const fila = document.createElement('tr');
        fila.innerHTML = `
          <td></td>
          <td></td>
          <td class="text-end">${p.cantidad < 5 ? '<span class="badge bg-danger">' + p.cantidad + '</span>' : p.cantidad}</td>
          <td class="text-end">$${p.precio.toFixed(2)}</td>
          <td class="text-end"><button class="btn btn-sm btn-outline-danger">Eliminar</button></td>`;
        fila.cells[0].textContent = p.nombre;
        fila.cells[1].textContent = p.categoria;
        fila.querySelector('button').addEventListener('click', () => {
          productos.splice(i, 1);
          render();
        });
        tbody.appendChild(fila);
      });

      document.getElementById('total-productos').textContent = productos.length;
      document.getElementById('total-unidades').textContent = productos.reduce((s, p) => s + p.cantidad, 0);
      document.getElementById('stock-bajo').textContent = productos.filter(p => p.cantidad < 5).length;
    }

    document.getElementById('form-producto').addEventListener('submit', (e) => {
      e.preventDefault();
      productos.push({
        nombre: document.getElementById('nombre').value.trim(),
        categoria: document.getElementById('categoria').value.trim(),
        cantidad: parseInt(document.getElementById('cantidad').value, 10),
        precio: parseFloat(document.getElementById('precio').value)
      });
      e.target.reset();
      render();
    });

    render();
  </script>
</body>
</html>
